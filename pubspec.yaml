name: flutter_crypto_wallet
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  fl_chart: ^1.1.1
  get_it: ^9.2.0
  go_router: ^17.0.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1
  dio: ^5.7.0
  flutter_dotenv: ^5.2.1

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  url_launcher: ^6.3.2
  html: ^0.15.6
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  launcher_name: ^1.0.2
  mocktail: ^1.0.4

launcher_name:
  default: "BrasilCard Cripto"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"

flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/icon/

